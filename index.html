<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>PilotoVS Barber - Agendamento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    button {
      padding: 12px;
      width: 100%;
      cursor: pointer;
      background: black;
      color: white;
      font-size: 16px;
      border: none;
      margin-top: 10px;
    }
    #saida {
      background: #f3f3f3;
      padding: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Agendamento - PilotovsBarber</h1>

  <label>Data:</label>
  <input type="date" id="data" />

  <label>Horários disponíveis:</label>
  <select id="horarios">
    <option value="">Selecione uma data</option>
  </select>

  <label>Nome:</label>
  <input type="text" id="nome" />

  <label>Telefone:</label>
  <input type="text" id="telefone" />

  <button id="btnAgendar">Confirmar Agendamento</button>

  <pre id="saida">Selecione uma data para carregar horários.</pre>

  <script src="script.js"></script>

</body>
</html>
