<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piloto VS Barber - Agendamento</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Piloto VS Barber</h1>
    <p class="subtitle">Agende seu horário rapidamente</p>

    <div class="card">

      <label>Data:</label>
      <input type="date" id="data" class="input" />

      <label>Horários disponíveis:</label>
      <select id="horarios" class="input">
        <option value="">Selecione uma data</option>
      </select>

      <label>Nome:</label>
      <input type="text" id="nome" class="input" placeholder="Seu nome" />

      <label>Telefone:</label>
      <input type="text" id="telefone" class="input" placeholder="(XX) XXXXX-XXXX" />

      <button id="btnAgendar">Confirmar Agendamento</button>
    </div>

    <div id="toast"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
